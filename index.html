<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UTA STUDY</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#1f3a5f"><link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<script>window.UTA_APP=true</script>
<style>
:root{--bg:#f6f1e7;--card:#fffdf8;--tx:#2a2a2a;--ac:#1f3a5f;--hl:#e1eaf4;--mut:#777;--bd:#e2dccd;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme=dark]{--bg:#16181d;--card:#1f232a;--tx:#e8e6e1;--ac:#8fb4e8;--hl:#2a3547;--mut:#9a9a9a;--bd:#2f343d}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font-family:"Noto Sans KR","Hiragino Sans","Noto Sans JP",sans-serif}
header{display:flex;gap:8px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--bd);flex-wrap:wrap}
header b{color:var(--ac);font-size:20px;letter-spacing:2px;margin-right:12px}
button,select,input{font:inherit;color:var(--tx)}
button{background:var(--card);border:1px solid var(--bd);border-radius:12px;min-height:44px;padding:0 14px;cursor:pointer}
button.on,button.pri{background:var(--ac);color:var(--bg);border-color:var(--ac)}
main{padding:12px;height:calc(100% - 66px);overflow:auto}
.study{display:grid;grid-template-columns:260px 1fr 300px;gap:12px;height:100%}
.col{background:var(--card);border-radius:16px;padding:14px;overflow:auto}
.cover{height:130px;border-radius:14px;background:linear-gradient(135deg,var(--ac),#5a8a8f);display:flex;align-items:center;justify-content:center;color:#fff;font-size:44px}
.row{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0;align-items:center}
.row input[type=range]{flex:1;min-width:80px}
.lyr{padding:10px 14px;border-radius:12px;cursor:pointer;margin:4px 0}
.lyr.cur{background:var(--hl)}
.jp{font-family:"Hiragino Mincho ProN","Noto Serif JP","Yu Mincho",serif;line-height:2}
.tk{cursor:pointer;border-radius:6px;padding:0 1px}
.tk:hover,.tk.sel{background:var(--hl);outline:1px solid var(--ac)}
.tk.sv::after{content:"🔖";font-size:.4em}
rt{font-size:.5em;color:var(--ac)}
.nofuri rt{visibility:hidden}
.tr{color:var(--mut);font-size:15px;margin-top:2px}
.mut{color:var(--mut);font-size:14px}
.big{font-size:40px}
.vi{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px;border-bottom:1px solid var(--bd)}
.opt{display:block;width:100%;margin:8px 0;font-size:20px}
.ok{background:#2e7d4f;color:#fff}.ng{background:#a33;color:#fff}
.apphint{display:none}
body.focus header{display:none}
body.focus main{height:100%;padding:6px}
#fbtn{position:fixed;top:6px;right:6px;z-index:7;display:none;min-height:36px;padding:0 10px;opacity:.85}
body.focus #fbtn{display:block}
.lytb{position:sticky;top:-14px;z-index:3;background:var(--card);margin:-14px -14px 8px;padding:10px 14px;border-bottom:1px solid var(--bd);border-radius:16px 16px 0 0}
@media(max-width:900px){.study{grid-template-columns:1fr;height:auto}.study .col{overflow:visible}.lytb{top:0;border-radius:0}}
#ai,#nml,#aih,#tp,#tro{display:none!important}
.apphint{display:block!important}
</style></head><body>
<header><b>UTA STUDY</b>
<button data-v="home">🏠 홈</button><button data-v="add">➕ 노래 추가</button><button data-v="study">🎵 학습</button><button data-v="vocab">🔖 단어장</button><button data-v="quiz">✏️ 읽기 퀴즈</button><button data-v="line">📖 줄 읽기</button><button data-v="log">📅 기록</button><button data-v="set">⚙️ 설정</button><button id="fcb">🔲 넓게 보기</button><button id="fsb">⛶ 전체 화면</button></header><button id="fbtn">☰ 메뉴</button>
<main id="m"></main>
<script>
// ===== 샘플 가사 (직접 작성한 짧은 예문, 저작권 문제 없음) =====
// 단어: [표기, 읽기(없으면 ""), 한국어 뜻, 품사]
const SAMPLE={id:"sample",title:"샘플: 별하늘의 노래",artist:"UTA STUDY 연습용",lines:[
{k:"내일도 너를 만나고 싶어",w:[["明日","あした","내일","명사"],["も","","",""],["君","きみ","너, 그대","대명사"],["に","","",""],["会","あ","만나다 (会う)","동사"],["いたい","","",""]]},
{k:"세계는 마음속에 있다",w:[["世界","せかい","세계, 세상","명사"],["は","","",""],["心","こころ","마음","명사"],["の","","",""],["中","なか","속, 안","명사"],["に","","",""],["ある","","",""]]},
{k:"소중한 말을 잊지 않아",w:[["大切","たいせつ","소중함","형용동사"],["な","","",""],["言葉","ことば","말, 언어","명사"],["を","","",""],["忘","わす","잊다 (忘れる)","동사"],["れない","","",""]]},
{k:"별하늘 아래에서 노래하자",w:[["星空","ほしぞら","별이 빛나는 하늘","명사"],["の","","",""],["下","した","아래","명사"],["で","","",""],["歌","うた","노래하다 (歌う)","동사"],["おう","","",""]]}]};
let SONG=SAMPLE;
// ===== 저장 / 불러오기 (오류가 나도 앱이 멈추지 않게 try/catch) =====
let st={vocab:[],set:{furi:true,tr:true,size:28,dark:matchMedia("(prefers-color-scheme:dark)").matches},ts:{},tsAll:{},songs:[],cur:"sample",log:{}};
try{const d=JSON.parse(localStorage.getItem("uta")||"null");if(d&&Array.isArray(d.vocab)){st=Object.assign(st,d);st.set=Object.assign({furi:true,tr:true,size:28,dark:false},d.set)}}catch(e){}
function useSong(id){SONG=id==="sample"?SAMPLE:(st.songs.find(s=>s.id===id)||SAMPLE);st.cur=SONG.id;st.tsAll[SONG.id]=st.tsAll[SONG.id]||(SONG.id==="sample"?st.ts:null)||{};st.ts=st.tsAll[SONG.id];sel=0;selW=null}
function dlg(msg,fields){return new Promise(res=>{const o=document.createElement("div");o.style.cssText="position:fixed;inset:0;background:#0007;display:flex;align-items:center;justify-content:center;z-index:9";
 o.innerHTML=`<div class="col" style="max-width:420px;width:90%;overflow:visible"><p>${esc(msg)}</p>${(fields||[]).map(f=>`<p class="mut">${esc(f[0])}<br><input value="${esc(f[1]||"")}" style="width:100%;box-sizing:border-box;min-height:40px;border:1px solid var(--bd);border-radius:10px;padding:0 8px;background:var(--bg);color:var(--tx)"></p>`).join("")}<div class="row"><button class="pri" id="dy">확인</button><button id="dn">취소</button></div></div>`;
 document.body.appendChild(o);const done=v=>{o.remove();res(v)};
 o.querySelector("#dy").onclick=()=>done(fields?[...o.querySelectorAll("input")].map(i=>i.value):true);o.querySelector("#dn").onclick=()=>done(null)})}
let lastRaw=null;
function save(){try{const r=JSON.stringify(st);localStorage.setItem("uta",r);lastRaw=r}catch(e){dlg("저장에 실패했어요. 저장 공간이 부족할 수 있어요. 설정에서 백업을 받아 주세요.")}}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const key=w=>w[0]+"|"+w[1]+"|"+w[2];
const tzo=new Date().getTimezoneOffset()*6e4;
const addDays=n=>new Date(Date.now()-tzo+n*864e5).toISOString().slice(0,10);
const today=()=>addDays(0);
const isDue=v=>!v.due||v.due<=today();
const $=s=>document.querySelector(s);
let view="study",sel=0,selW=null,loop=false,audio=new Audio(),qs=null;
audio.addEventListener("timeupdate",tick);audio.addEventListener("loadedmetadata",()=>{const t=$("#dur");if(t)t.textContent=fmt(audio.duration)});
const fmt=t=>isFinite(t)?Math.floor(t/60)+":"+String(Math.floor(t%60)).padStart(2,"0"):"0:00";
function theme(){document.documentElement.dataset.theme=st.set.dark?"dark":"light"}
function lineEnd(i){const n=st.ts[i+1];return n!=null?n:(audio.duration||1e9)}
function tick(){
 const t=audio.currentTime,p=$("#pos");if(p){p.value=t;p.max=audio.duration||0;$("#cur").textContent=fmt(t)}
 if(audioFor&&audioFor!==SONG.id)return;
 if(loop&&st.ts[sel]!=null&&t>=lineEnd(sel)){audio.currentTime=st.ts[sel]}
 let c=-1;SONG.lines.forEach((l,i)=>{if(st.ts[i]!=null&&st.ts[i]<=t)c=i});
 if(c>=0&&c!==sel&&!audio.paused&&!loop){sel=c;mark(true)}}
function mark(scroll){document.querySelectorAll(".lyr").forEach((e,i)=>{e.classList.toggle("cur",i===sel);if(scroll&&i===sel)e.scrollIntoView({block:"center",behavior:"smooth"})})}
function render(){theme();const pp=$("#pen");if(pp)pp.remove();document.querySelectorAll("header button").forEach(b=>b.classList.toggle("on",b.dataset.v===view));
 ({home:rHome,add:rAdd,line:rLine,log:rLog,study:rStudy,vocab:rVocab,quiz:rQuiz,set:rSet})[view]()}
document.querySelector("header").onclick=e=>{const v=e.target.dataset.v;if(v){view=v;render()}};
// ===== 학습 화면 =====
function rStudy(){
 $("#m").innerHTML=`<div class="study">
 <div class="col"><div class="cover"${SONG.img?` style="background:center/cover url(${SONG.img})"`:""}>${SONG.img?"":(SONG.kind==="story"?"📖":"♪")}</div><h3 style="margin:10px 0 0">${esc(SONG.title)}</h3><div class="mut">${esc(SONG.artist)}</div>
 <div class="row"><input type="file" id="f" accept="audio/*"><button id="fd" style="min-height:36px">🗑 저장한 파일 지우기</button></div><div class="mut" id="fmsg">음악 파일을 선택하면 재생할 수 있어요. (MP3, M4A, WAV 등)</div>
 <div class="row"><input type="range" id="pos" min="0" max="0" step="0.1" value="0"></div>
 <div class="row mut"><span id="cur">0:00</span>/<span id="dur">0:00</span></div>
 <div class="row"><button id="pp" class="pri" style="flex:1;min-height:56px">▶ 재생 / ⏸</button></div>
 <div class="row"><button data-s="-10">⏪10</button><button data-s="-5">−5</button><button data-s="5">+5</button><button data-s="10">10⏩</button></div>
 <div class="row">속도 <select id="sp">${[.5,.75,1,1.25,1.5,2].map(x=>`<option ${x==1?"selected":""}>${x}</option>`)}</select> 음량 <input type="range" id="vol" min="0" max="1" step="0.05" value="${audio.volume}"></div>
 <div class="row"><button id="lp" class="${loop?"on":""}">🔁 선택 줄 반복</button></div>
 <div class="row"><button id="setT">⏱ 선택 줄 시작 시간 = 지금 재생 위치</button></div>
 <div class="mut">시간을 지정한 줄만 음악에 맞춰 강조돼요. 지정하지 않으면 일반 텍스트처럼 읽을 수 있어요.</div></div>
 <div class="col"><div class="row lytb"><button id="tf" class="${st.set.furi?"on":""}">후리가나</button><button id="tpr" class="${st.set.pr!==false?"on":""}">발음</button><button id="tt" class="${st.set.tr?"on":""}">번역</button><button id="tp" class="${st.set.pen!==false?"on":""}">✏️ 펜 해석</button>
 글자 <input type="range" id="sz" min="18" max="48" value="${st.set.size}"></div><div id="ly"></div></div>
 <div class="col" id="pn"></div></div>`;
 drawLy();drawPanel();
 $("#f").onchange=e=>{const f=e.target.files[0];if(!f)return;audio.src=URL.createObjectURL(f);audio.load();audioFor=SONG.id;$("#fmsg").textContent="선택한 파일: "+f.name;aPut(SONG.id,f).then(()=>{const m=$("#fmsg");if(m)m.textContent="선택한 파일: "+f.name+" (이 기기에 저장했어요)"}).catch(()=>{const m=$("#fmsg");if(m)m.textContent="선택한 파일: "+f.name+" (저장하지 못했어요. 저장 공간을 확인해 주세요)"});audio.onerror=()=>$("#fmsg").textContent="이 파일은 재생할 수 없어요. 다른 형식(MP3 등)을 선택해 주세요."};
 $("#pp").onclick=()=>{if(!audio.src){$("#fmsg").textContent="먼저 음악 파일을 추가해 주세요.";return}audio.paused?audio.play().catch(()=>$("#fmsg").textContent="재생할 수 없어요. 파일을 다시 선택해 주세요."):audio.pause()};
 document.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{audio.currentTime=Math.max(0,audio.currentTime+ +b.dataset.s)});
 $("#pos").oninput=e=>{audio.currentTime=+e.target.value};
 $("#sp").onchange=e=>{audio.playbackRate=+e.target.value};$("#vol").oninput=e=>{audio.volume=+e.target.value};
 $("#lp").onclick=e=>{if(!loop&&st.ts[sel]==null){dlg("이 줄은 시작 시간이 없어요. 먼저 '시작 시간 = 지금 재생 위치'로 지정해 주세요.");return}loop=!loop;e.target.classList.toggle("on",loop)};
 $("#setT").onclick=()=>{if(!audio.src){dlg("먼저 음악 파일을 추가해 주세요.");return}st.ts[sel]=+audio.currentTime.toFixed(1);save();$("#fmsg").textContent=`${sel+1}번째 줄 시작: ${fmt(st.ts[sel])}`};
 $("#tf").onclick=()=>{st.set.furi=!st.set.furi;save();rStudy()};$("#tt").onclick=()=>{st.set.tr=!st.set.tr;save();rStudy()};$("#tpr").onclick=()=>{st.set.pr=st.set.pr===false;save();rStudy()};
 $("#tp").onclick=()=>{st.set.pen=st.set.pen===false;save();rStudy()};
 $("#ly").addEventListener("pointerup",penCheck);
 $("#sz").oninput=e=>{st.set.size=+e.target.value;save();$("#ly").style.fontSize=st.set.size+"px"};
 audio.playbackRate=+$("#sp").value;
 $("#fd").onclick=async()=>{if(await dlg("이 노래에 저장해 둔 음악 파일을 지울까요? (가사와 단어장은 그대로예요)")){try{await aDel(SONG.id)}catch(e){}audio.pause();audio.removeAttribute("src");audioFor="";$("#fmsg").textContent="저장한 음악 파일을 지웠어요."}};
 if(isFinite(audio.duration))$("#dur").textContent=fmt(audio.duration);
 loadSaved()}
// ===== 음악 파일 저장 (브라우저 IndexedDB: 큰 파일을 기기에 보관하는 곳) =====
let audioFor="";
const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open("uta",1);r.onupgradeneeded=()=>r.result.createObjectStore("audio");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
async function aPut(id,blob){try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
 const db=await idb();return new Promise((res,rej)=>{const t=db.transaction("audio","readwrite");t.objectStore("audio").put(blob,id);t.oncomplete=res;t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})}
async function aGet(id){const db=await idb();return new Promise((res,rej)=>{const q=db.transaction("audio").objectStore("audio").get(id);q.onsuccess=()=>res(q.result||null);q.onerror=()=>rej(q.error)})}
async function aDel(id){const db=await idb();return new Promise((res,rej)=>{const t=db.transaction("audio","readwrite");t.objectStore("audio").delete(id);t.oncomplete=res;t.onerror=()=>rej(t.error)})}
async function loadSaved(){if(audioFor===SONG.id&&audio.getAttribute("src"))return;
 try{const b=await aGet(SONG.id);if(!b)return;audio.src=URL.createObjectURL(b);audio.load();audioFor=SONG.id;const m=$("#fmsg");if(m)m.textContent="저장된 음악 파일을 불러왔어요"+(b.name?": "+b.name:"")}catch(e){}}
// ===== 펜으로 선택한 문장 해석 (Claude) =====
let penLast="",penP="",penT="",penA0="",penHist=[],penQA=[],penReady=false;
function showPen(t,msg){penT=t;let o=$("#pen");if(!o){o=document.createElement("div");o.id="pen";o.style.cssText="position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));max-height:42vh;overflow:auto;background:var(--card);border:1px solid var(--ac);border-radius:16px;padding:14px;z-index:8;box-shadow:0 4px 20px #0004";document.body.appendChild(o)}
 o.innerHTML=`<div class="row" style="justify-content:space-between;margin:0"><b class="jp">${esc(t)}</b><button id="px">✕ 닫기</button></div><div style="white-space:pre-wrap;margin-top:8px">${esc(msg)}</div>${penQA.map(x=>`<div style="margin-top:10px;color:var(--ac)">❓ ${esc(x.q)}</div><div style="white-space:pre-wrap">${esc(x.a)}</div>`).join("")}${penReady?`<div class="row"><input id="pq" placeholder="더 궁금한 점을 적어 주세요" style="flex:1;min-width:120px;min-height:44px;border:1px solid var(--bd);border-radius:10px;padding:0 10px;background:var(--bg);color:var(--tx)"><button class="pri" id="pb">묻기</button></div>`:""}`;
 $("#px").onclick=()=>{o.remove();penLast=""};
 if(penReady){const go=()=>askMore($("#pq").value.trim());$("#pb").onclick=go;$("#pq").onkeydown=e=>{if(e.key==="Enter")go()}}
 o.scrollTop=o.scrollHeight}
async function askMore(q){if(!q)return;const sp=typeof claude!=="undefined"?await claude.use("sample"):null;if(!sp)return;
 penReady=false;penQA.push({q,a:"Claude가 답하는 중이에요..."});showPen(penT,penA0);
 try{const msgs=[...penHist,{role:"user",content:q+"\n(위 문장에 대한 질문입니다. 한국어로 짧게 답해 주세요. 모르면 추측하지 말 것.)"}];
  const r=await sp(msgs,{cache:false});penQA[penQA.length-1].a=r.text;penHist=[...msgs,{role:"assistant",content:r.text}]}
 catch(e){penQA[penQA.length-1].a=e&&e.code==="not_granted"?"허용하지 않아서 실행하지 않았어요.":"답을 받지 못했어요. 다시 물어봐 주세요."}
 penReady=true;showPen(penT,penA0)}
function penCheck(){if(st.set.pen===false||window.UTA_APP)return;setTimeout(()=>{const s=getSelection();if(!s||!s.rangeCount||s.isCollapsed)return;
  const f=s.getRangeAt(0).cloneContents();f.querySelectorAll("rt").forEach(n=>n.remove());const t=f.textContent.replace(/\s+/g," ").trim();
  if(t.length<2||!/[\u3040-\u30ff\u4e00-\u9faf]/.test(t))return;
  if(t.length>120){penReady=false;showPen(t.slice(0,20)+"…","한 번에 해석할 수 있는 길이를 넘었어요. 한두 줄만 선택해 주세요.");return}
  if(t===penLast)return;penLast=t;askPen(t)},350)}
async function askPen(t){penQA=[];penReady=false;const sp=typeof claude!=="undefined"?await claude.use("sample"):null;
 if(!sp){showPen(t,"이 화면에서는 Claude 연동을 쓸 수 없어요.");return}
 showPen(t,"Claude가 해석하는 중이에요...");
 try{const r=await sp(penP='일본어 학습자(한국어 사용자)를 위해 다음 일본어 문장을 설명해 주세요.\n문장: '+t+'\n형식(항목마다 한~두 줄, 짧게): 번역(자연스러운 한국어) / 직역 / 문법 포인트 / 주요 단어(읽기와 뜻) / 뉴앙스 한 줄(모르면 추측하지 말 것).');penA0=r.text;penHist=[{role:"user",content:penP},{role:"assistant",content:r.text}];penReady=true;showPen(t,r.text)}
 catch(e){showPen(t,e&&e.code==="not_granted"?"허용하지 않아서 실행하지 않았어요.":e&&e.code==="rate_limited"?"잠시 후에 다시 시도해 주세요.":"답을 받지 못했어요. 다시 선택해 주세요.")}}
function drawLy(){
 $("#ly").style.fontSize=st.set.size+"px";

const hasKana=l=>/[\u3040-\u30ff]/.test(l),hasKanji=l=>/[\u4e00-\u9faf]/.test(l),hasHangul=l=>/[\uac00-\ud7a3]/.test(l),hasLatin=l=>/[A-Za-z]/.test(l);

function splitStory(text){

 const c=t.replace(/([、-ヿ一-龯！-～])[ 　\t]+(?=[、-ヿ一-龯！-～])/g,"$1");
 const out=[];let cur="";
 for(let i=0;i<c.length;i++){const ch=c[i];cur+=ch;
  if("。！？!?".includes(ch)){if(c[i+1]==="」"||c[i+1]==="』")continue;out.push(cur.trim());cur=""}
  else if(ch==="」"||ch==="』"){if(/[。！？!?]$/.test(cur.slice(0,-1))||c[i+1]==="「"){out.push(cur.trim());cur=""}}}
 if(cur.trim())out.push(cur.trim());

  catch(e){em.style.color="#a33";em.textContent=e===2?"Claude가 빈 결과를 돌려줬어요. Claude가 이 글의 번역을 하지 않았을 수 있어요. (입력한 글은 그대로 남겨 두었어요.)":e&&e.code==="not_granted"?"허용하지 않아서 실행하지 않았어요.":e&&e.code==="rate_limited"?"잠시 후에 다시 시도해 주세요.":"Claude 응답을 처리하지 못했어요. 다시 시도해 주세요."}};
 $("#ai").onclick=async()=>{const src=$("#nl").value.split("\n").map(s=>s.trim()).filter(Boolean),em=$("#em");

  try{const nm=$("#nm").checked,G=nm?group(src.join("\n"),"3"):null;if(nm&&!G.length)throw 1;
   const NM='다음은 노래 가사 줄 목록입니다. 각 줄은 [번호]로 시작합니다. 일본어 줄은 복사하면서 한자 바로 뒤에 후리가나가 그대로 붙어 있을 수 있습니다(예: "漢字かんじ"처럼 한자 뒤에 읽기가 이어 붙은 형태). 영어만으로 된 줄도 있습니다.\n규칙: 1) 붙어 있는 후리가나를 분리해 한자 단어 바로 뒤에 (읽기|한국어 뜻) 형식으로 바꿀 것. 예: 明日(あした|내일). 읽기는 입력에 적힌 후리가나를 그대로 쓰고 새로 추측하지 말 것. 원문 글자(한자, 히라가나, 가타카나, 영어)는 바꾸지 말 것. 2) 뜻은 짧은 한국어 단어로 직접 채울 것(뜻 안에 괄호와 | 금지). 3) 영어 등 일본어가 아닌 부분은 그대로 둘 것. 4) [번호]는 빼고, 입력 줄 수와 같은 수를 같은 순서로 JSON으로만 답할 것: {"lines":[{"ruby":"..."}]}\n\n';
   const r=await sp.json(nm?NM+"줄 수: "+G.length+"\n\n"+G.map((g,i)=>"["+(i+1)+"] "+g.jp).join("\n"):'다음 일본어 가사의 각 줄을 처리해 주세요.\n규칙: 1) 원문 글자는 절대 바꾸거나 빼거나 더하지 말 것. 2) 한자 단어 바로 뒤에 (읽기|한국어 뜻) 형식으로 붙일 것. 예: 明日(あした|내일)も君(きみ|너)に会(あ|만나다)いたい. 동사와 형용사는 한자 부분에만 붙이고 뒤의 히라가나는 그대로 둘 것. 읽기는 히라가나로 쓰고, 뜻 안에는 괄호와 | 를 쓰지 말 것. 3) 줄마다 자연스러운 한국어 번역을 쓸 것. 4) 입력 줄 수와 같은 수의 줄을 JSON으로만 답할 것: {"lines":[{"ruby":"...","ko":"..."}]}\n\n'+src.join("\n"));
   const L=r&&r.lines;if(!Array.isArray(L))throw 0;if(!L.length)throw 2;
   const strip=s=>String(s).replace(/[（(][^）)]*[）)]/g,"");
   $("#nl").value=L.map(x=>String(x.ruby||"").replace(/^\[\d+\]\s*/,"")).join("\n");$("#nr").value=nm?G.map(g=>g.tr).join("\n"):L.map(x=>x.ko).join("\n");if(nm)$("#np").value=G.map(g=>g.pr||"").join("\n");
   const bad=nm?[]:src.map((s,i)=>L[i]&&strip(L[i].ruby)===strip(s)?0:i+1).filter(Boolean);
   em.style.color="var(--mut)";em.textContent=(L.length!==(nm?G.length:src.length)?"줄 수가 달라졌어요(예상 "+(nm?G.length:src.length)+"줄, 결과 "+L.length+"줄). 확인해 주세요. ":"")+(bad.length?`원문과 달라진 줄: ${bad.join(", ")}번째. `:"")+(nm&&G.some(g=>g.note)?"한국어 줄이 하나뿐이라 번역으로 넣은 줄: "+G.map((g,i)=>g.note?i+1:0).filter(Boolean).join(", ")+"번째. ":"")+"결과를 읽어 보고 틀린 부분을 고친 뒤 저장해 주세요."}
  catch(e){em.style.color="#a33";em.textContent=e===2?"Claude가 빈 결과를 돌려줬어요. 가사가 길거나 Claude가 응답하지 않은 것일 수 있어요. 몇 줄씩 나눠서 다시 시도해 보세요. (입력한 가사는 그대로 남겨 두었어요.)":e===1?"가사 줄(일본어·영어)을 찾지 못했어요. 가사를 붙여 넣었는지 확인해 주세요.":e&&e.code==="not_granted"?"허용하지 않아서 실행하지 않았어요.":e&&e.code==="rate_limited"?"잠시 후에 다시 시도해 주세요.":"Claude 응답을 처리하지 못했어요. 다시 시도해 주세요."}};
 $("#ns").onclick=async()=>{const t=$("#nt").value.trim(),lines=parseLy($("#nl").value,$("#nr").value,$("#np").value);

 try{const d=JSON.parse(r);if(!d||!Array.isArray(d.vocab))return;lastRaw=r;const old=SONG.id;for(const k of Object.keys(d))st[k]=d[k];
